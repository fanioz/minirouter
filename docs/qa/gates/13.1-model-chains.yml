top_issues:
  - id: C1
    severity: medium
    title: "UpdateChainAsync — TOCTOU between two RWLS write-lock acquisitions"
    file: "Services/ModelChainService.cs"
    description: >
      UpdateChainAsync acquires a write lock to find the index, releases it,
      validates, then re-acquires a write lock to update _chains[index]. A
      concurrent DeleteChainAsync between the two lock windows could shift
      list indices, silently updating the wrong entry or throwing
      InvalidOperationException on the unlocked return-path read
      (`_chains.First(...)`). Probability is very low (operator-only, small list)
      but the pattern diverges from the safer single-lock approach used elsewhere.
    suggested_owner: dev

  - id: C2
    severity: low
    title: "ModelChains.svelte imports from 'lucide-svelte' instead of '@lucide/svelte'"
    file: "frontend/src/ModelChains.svelte"
    description: >
      Every other component in the project imports from '@lucide/svelte'. ModelChains.svelte
      imports from 'lucide-svelte' (legacy v1). Both packages resolve correctly and the
      build is clean, but it introduces a dual-package footprint and inconsistency.
    suggested_owner: dev

  - id: C3
    severity: low
    title: "Unused Dialog import in ModelChains.svelte"
    file: "frontend/src/ModelChains.svelte"
    description: >
      `import * as Dialog from '$lib/components/ui/dialog'` is imported but never
      referenced in the template — dev replaced Dialog with custom modal HTML.
      Tree-shaken by Vite so no bundle impact, but dead import adds noise.
    suggested_owner: dev

