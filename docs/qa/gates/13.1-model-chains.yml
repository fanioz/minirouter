nfr_validation:
  security:
    status: PASS
    notes: >
      All 4 CRUD endpoints gated by ApiKeyEndpointFilter. Input validated:
      name must be non-empty and slash-free; model targets must contain exactly one
      slash. No SQL surface (file-based JSON). No secrets in chain data. Chain name
      length not bounded (LOW, operator-only interface).
  performance:
    status: PASS
    notes: >
      GetChain()/IsChain() called on every proxied request — O(n) over a list
      typically <20 chains. Negligible. Cache invalidation on all CRUD writes
      keeps /v1/models fresh. PersistAsync uses durable flush — acceptable for
      infrequent operator writes.
  reliability:
    status: PASS
    notes: >
      Atomic write via temp+rename. LoadChainsAsync handles missing file, empty
      file, and corrupt JSON gracefully (empty list + log). Stale .tmp cleanup
      at startup. Circuit breaker keys on real provider/model coordinates,
      never the chain name alias.
  maintainability:
    status: CONCERNS
    notes: >
      lucide-svelte vs @lucide/svelte inconsistency (C2). Unused Dialog import
      (C3). ModelChain.ValidateTargets() helper on the record is not used by the
      service — parallel validation logic. Minor duplication, no correctness
      impact.

recommendations:
  immediate: []
  future:
    - action: >
        Consolidate UpdateChainAsync into a single write-lock window: find the index,
        validate, and replace within one EnterWriteLock/ExitWriteLock block. Use the
        returned updated chain from inside the lock for the return value instead of
        a post-lock _chains.First() call.
      refs: ["Services/ModelChainService.cs"]

    - action: >
        Migrate ModelChains.svelte icon imports from 'lucide-svelte' to '@lucide/svelte'
        and remove the unused Dialog import.
      refs: ["frontend/src/ModelChains.svelte"]

    - action: >
        Add a [Collection("ModelChainTests")] xUnit collection attribute to
        ModelChainServiceTests to prevent env-var mutation flakiness if test
        parallelism settings change.
      refs: ["Tests/ModelChainServiceTests.cs"]

    - action: >
        Add a test verifying chain names appear in GET /v1/models with owned_by == 'chain'.
        Extend ModelsEndpointTests to cover the story 13.1 integration path.
      refs: ["Tests/ModelsEndpointTests.cs"]
